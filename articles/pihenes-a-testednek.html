itle=`${a.title} — Kapibara.hu`;document.querySelector('meta[name="description"]').content=a.excerpt;document.querySelector('#cat').textContent=a.cat;document.querySelector('#minutes').textContent=`${a.minutes} perc olvasás`;document.querySelector('#kicker').textContent=a.kicker;document.querySelector('#title').textContent=a.title;document.querySelector('#excerpt').textContent=a.excerpt;document.querySelector('#body').innerHTML=a.body.map((b,i)=>b.h?`<h2>${b.h}</h2><p class="${i===0?'leadpara':''}">${b.p}</p>`:`<p class="${i===0?'leadpara':''}">${b.p}</p>`).join('');document.querySelector('#year').textContent=new Date().getFullYear();const nav=document.querySelector('.nav');document.querySelector('.hamb').onclick=()=>nav.classList.toggle('open');document.querySelectorAll('.nav a').forEach(x=>x.onclick=()=>nav.classList.remove('open'));</script></body></html>
